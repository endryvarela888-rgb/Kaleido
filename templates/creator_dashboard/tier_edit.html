{% extends 'creator_dashboard/base.html' %}
{% block title %}Kaleido — Edit tier{% endblock %}
{% block dashboard_content %}
<h1 class="page-heading">Edit tier</h1>
<form method="post" class="profile-edit-form">
    {% csrf_token %}
    <label>Name {{ form.name }}</label>
    <label>Description {{ form.description }}</label>
    <label>Price (USD/month) {{ form.price }}</label>
    <label>Level {{ form.level }} {{ form.level.errors }}</label>
    <button type="submit" class="btn btn--primary btn--sm">Save changes</button>
</form>
{% endblock %}
