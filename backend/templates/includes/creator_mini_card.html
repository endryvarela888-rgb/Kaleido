<a href="{% url 'users:profile' creator.pk %}" class="creator-mini-card">
    {% if creator.avatar %}
        <img class="avatar avatar--sm avatar--image" src="{{ creator.avatar.url }}"
             style="object-position: {{ creator.avatar_position_x }}% {{ creator.avatar_position_y }}%;"
             alt="{{ creator.display_name }}">
    {% else %}
        <span class="avatar avatar--sm">{{ creator.display_name|first|upper }}</span>
    {% endif %}
    <div>
        <p class="creator-mini-card__name">{{ creator.display_name }}</p>
        {% if creator.creator_profile.category %}
            <p class="creator-mini-card__category">{{ creator.creator_profile.category.name }}</p>
        {% endif %}
    </div>
</a>
