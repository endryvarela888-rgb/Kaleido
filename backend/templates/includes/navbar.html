<header class="topbar">
    <button class="icon-btn" id="sidebarToggle" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <form class="search-bar" role="search" method="get" action="{% url 'core:home' %}">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" name="q" placeholder="Search content creators…" autocomplete="off" value="{{ request.GET.q }}">
        <select name="category" class="search-filter">
            <option value="">All categories</option>
            {% for category in nav_categories %}
                <option value="{{ category.slug }}" {% if request.GET.category == category.slug %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </form>
    <div class="topbar-right">
        {% if user.is_authenticated %}
            <button class="avatar-btn" id="userMenuToggle" aria-label="Open user menu">
                {% if user.avatar %}
                    <img class="avatar avatar--sm avatar--image" src="{{ user.avatar.url }}"
                         style="object-position: {{ user.avatar_position_x }}% {{ user.avatar_position_y }}%;"
                         alt="{{ user.display_name }}">
                {% else %}
                    <span class="avatar avatar--sm">{{ user.display_name|first|upper }}</span>
                {% endif %}
            </button>
            <div class="dropdown-menu" id="userMenu">
                {% if user.is_creator %}
                    <a href="{% url 'creator_content:list' %}">Creator studio</a>
                {% endif %}
                <a href="{% url 'users:profile' user.pk %}">Go to profile</a>
                <a href="{% url 'users:settings' %}">Settings</a>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            </div>
        {% else %}
            <a href="{% url 'users:login' %}" class="btn btn--ghost">Log in</a>
            <a href="{% url 'users:signup' %}" class="btn btn--primary">Sign up</a>
{% endif %}
    </div>
</header>
