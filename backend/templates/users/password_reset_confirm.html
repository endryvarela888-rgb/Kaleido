{% extends 'base.html' %}
{% block title %}Kaleido — Set new password{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        {% if validlink %}
            <h1 class="auth-title">Choose a new password</h1>
            <form method="post" class="auth-form">
                {% csrf_token %}
                <label>New password
                    {{ form.new_password1 }}
                    {{ form.new_password1.errors }}
                </label>
                <label>Confirm new password
                    {{ form.new_password2 }}
                    {{ form.new_password2.errors }}
                </label>
                <button type="submit" class="btn btn--primary btn--block">Reset password</button>
            </form>
        {% else %}
            <h1 class="auth-title">This link is invalid or expired</h1>
            <a href="{% url 'users:password_reset' %}" class="btn btn--primary btn--block">Request a new link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
