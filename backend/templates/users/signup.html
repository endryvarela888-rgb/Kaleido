{% extends 'base.html' %}
{% block title %}Kaleido — Sign up{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join Kaleido and start following creators.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <label>Email
                {{ form.email }}
                {{ form.email.errors }}
            </label>
            <label>Display name
                {{ form.display_name }}
                {{ form.display_name.errors }}
            </label>
            <label>Password
                {{ form.password1 }}
                {{ form.password1.errors }}
            </label>
            <label>Confirm password
                {{ form.password2 }}
                {{ form.password2.errors }}
            </label>
            <button type="submit" class="btn btn--primary btn--block">Sign up</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="{% url 'users:login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
